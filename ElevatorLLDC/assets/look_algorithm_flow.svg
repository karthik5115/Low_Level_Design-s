<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: bold; }
      .sub-title { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; }
      .box-start { fill: #3b82f6; rx: 20; }
      .box-decision { fill: #1e293b; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
      .box-process { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .box-action { fill: #1e293b; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .box-reverse { fill: #1e293b; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .text-title { fill: #ffffff; font-family: sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .text-body { fill: #cbd5e1; font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 10.5px; text-anchor: middle; }
      .text-label { fill: #38bdf8; font-family: sans-serif; font-size: 11px; font-weight: 600; }
      .flow-arrow { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .flow-arrow-yes { stroke: #10b981; stroke-width: 1.5; fill: none; }
      .flow-arrow-no { stroke: #ef4444; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#10b981" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="1100" height="800" class="bg"/>

  <text x="50" y="45" class="title-text">LOOK Algorithm Execution Flowchart</text>
  <text x="50" y="68" class="sub-title">Elevator Car Controller LOOK Scheduling Cycle (Ascending/Descending &amp; Dynamic Queue Transfer)</text>

  <!-- Start -->
  <g transform="translate(475, 100)">
    <rect width="150" height="40" class="box-start"/>
    <text x="75" y="25" class="text-title">Call move()</text>
  </g>
  <line x1="550" y1="140" x2="550" y2="175" class="flow-arrow" marker-end="url(#arrow)"/>

  <!-- Decision: Any queue active? -->
  <g transform="translate(430, 175)">
    <rect width="240" height="60" class="box-decision"/>
    <text x="120" y="27" class="text-title" fill="#f59e0b">Any Queue Not Empty?</text>
    <text x="120" y="45" class="text-body">up, down, or pending queues</text>
  </g>

  <!-- No -> Exit IDLE -->
  <line x1="670" y1="205" x2="880" y2="205" class="flow-arrow-no" marker-end="url(#arrow-red)"/>
  <text x="740" y="195" fill="#ef4444" font-size="11" font-family="sans-serif" font-weight="bold">NO (All Empty)</text>
  <g transform="translate(880, 185)">
    <rect width="160" height="40" class="box-start" fill="#475569"/>
    <text x="80" y="25" class="text-title">Set IDLE &amp; Finish</text>
  </g>

  <!-- Yes -> Direction Check -->
  <line x1="550" y1="235" x2="550" y2="280" class="flow-arrow-yes" marker-end="url(#arrow-green)"/>
  <text x="558" y="260" fill="#10b981" font-size="11" font-family="sans-serif" font-weight="bold">YES</text>

  <g transform="translate(440, 280)">
    <rect width="220" height="50" class="box-decision"/>
    <text x="110" y="30" class="text-title" fill="#f59e0b">Check Direction</text>
  </g>

  <!-- Left: Direction UP -->
  <path d="M 440 305 L 230 305 L 230 360" class="flow-arrow" marker-end="url(#arrow)"/>
  <text x="310" y="295" class="text-label">Direction == UP</text>

  <!-- Right: Direction DOWN -->
  <path d="M 660 305 L 870 305 L 870 360" class="flow-arrow" marker-end="url(#arrow)"/>
  <text x="730" y="295" class="text-label">Direction == DOWN</text>

  <!-- UP Column Flow -->
  <g transform="translate(100, 360)">
    <rect width="260" height="75" class="box-process"/>
    <text x="130" y="25" class="text-title" fill="#38bdf8">1. Process UP Queue</text>
    <text x="130" y="45" class="text-body">floor = upQueue.poll() [Min-Heap]</text>
    <text x="130" y="62" class="text-body">Display floor, open/close doors</text>
  </g>
  <line x1="230" y1="435" x2="230" y2="475" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(100, 475)">
    <rect width="260" height="65" class="box-action"/>
    <text x="130" y="25" class="text-title" fill="#34d399">2. Drain Pending Down</text>
    <text x="130" y="47" class="text-body">downQueue.offer(pendingDown.poll())</text>
  </g>
  <line x1="230" y1="540" x2="230" y2="580" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(90, 580)">
    <rect width="280" height="75" class="box-reverse"/>
    <text x="140" y="25" class="text-title" fill="#c084fc">3. LOOK Reversal Check</text>
    <text x="140" y="45" class="text-body">If downQueue not empty → set DOWN</text>
    <text x="140" y="62" class="text-body">Else if pendingUP not empty → set UP</text>
  </g>

  <!-- DOWN Column Flow -->
  <g transform="translate(740, 360)">
    <rect width="260" height="75" class="box-process"/>
    <text x="130" y="25" class="text-title" fill="#38bdf8">1. Process DOWN Queue</text>
    <text x="130" y="45" class="text-body">floor = downQueue.poll() [Max-Heap]</text>
    <text x="130" y="62" class="text-body">Display floor, open/close doors</text>
  </g>
  <line x1="870" y1="435" x2="870" y2="475" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(740, 475)">
    <rect width="260" height="65" class="box-action"/>
    <text x="130" y="25" class="text-title" fill="#34d399">2. Drain Pending UP</text>
    <text x="130" y="47" class="text-body">upQueue.offer(pendingUP.poll())</text>
  </g>
  <line x1="870" y1="540" x2="870" y2="580" class="flow-arrow" marker-end="url(#arrow)"/>

  <g transform="translate(730, 580)">
    <rect width="280" height="75" class="box-reverse"/>
    <text x="140" y="25" class="text-title" fill="#c084fc">3. LOOK Reversal Check</text>
    <text x="140" y="45" class="text-body">If upQueue not empty → set UP</text>
    <text x="140" y="62" class="text-body">Else if pendingDown not empty → set DOWN</text>
  </g>

  <!-- Loop back from bottom to CheckQueues -->
  <path d="M 230 655 L 230 730 L 550 730 L 550 670" class="flow-arrow"/>
  <path d="M 870 655 L 870 730 L 550 730" class="flow-arrow"/>
  <line x1="550" y1="670" x2="550" y2="245" class="flow-arrow" marker-end="url(#arrow)"/>
  <text x="560" y="715" fill="#94a3b8" font-size="10" font-family="monospace">Loop until all queues are serviced</text>

</svg>