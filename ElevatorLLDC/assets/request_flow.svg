<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: bold; }
      .sub-title { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; }
      .lifeline { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .actor-box { fill: #1e293b; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .actor-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .msg-line { stroke: #38bdf8; stroke-width: 1.5; fill: none; }
      .msg-text { fill: #e2e8f0; font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; }
      .num-badge { fill: #3b82f6; }
      .num-text { fill: #ffffff; font-family: sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; }
      .alt-box { fill: #1e293b; fill-opacity: 0.6; stroke: #64748b; stroke-width: 1; rx: 6; stroke-dasharray: 4,4; }
      .alt-label { fill: #f59e0b; font-family: sans-serif; font-size: 11px; font-weight: bold; }
      .note-box { fill: #0284c7; fill-opacity: 0.15; stroke: #0284c7; stroke-width: 1; rx: 4; }
      .note-text { fill: #7dd3fc; font-family: sans-serif; font-size: 11px; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="1200" height="700" class="bg"/>

  <text x="50" y="45" class="title-text">Request Dispatch &amp; Queue Assignment Sequence Flow</text>
  <text x="50" y="68" class="sub-title">Step-by-step trace of External and Internal button requests to Elevator Queues</text>

  <!-- Actors -->
  <g transform="translate(80, 100)">
    <rect width="120" height="40" class="actor-box"/>
    <text x="60" y="25" class="actor-title">Passenger</text>
    <line x1="60" y1="40" x2="60" y2="560" class="lifeline"/>
  </g>

  <g transform="translate(280, 100)">
    <rect width="140" height="40" class="actor-box"/>
    <text x="70" y="25" class="actor-title">Floor / Buttons</text>
    <line x1="70" y1="40" x2="70" y2="560" class="lifeline"/>
  </g>

  <g transform="translate(510, 100)">
    <rect width="180" height="40" class="actor-box"/>
    <text x="90" y="25" class="actor-title">ExternalDispatcher</text>
    <line x1="90" y1="40" x2="90" y2="560" class="lifeline"/>
  </g>

  <g transform="translate(760, 100)">
    <rect width="180" height="40" class="actor-box"/>
    <text x="90" y="25" class="actor-title">ElevatorCarController</text>
    <line x1="90" y1="40" x2="90" y2="560" class="lifeline"/>
  </g>

  <g transform="translate(1000, 100)">
    <rect width="130" height="40" class="actor-box"/>
    <text x="65" y="25" class="actor-title">ElevatorCar</text>
    <line x1="65" y1="40" x2="65" y2="560" class="lifeline"/>
  </g>

  <!-- Step 1: External button press -->
  <circle cx="140" cy="180" r="10" class="num-badge"/>
  <text x="140" y="184" class="num-text">1</text>
  <line x1="140" y1="180" x2="345" y2="180" class="msg-line" marker-end="url(#arrow-blue)"/>
  <text x="160" y="173" class="msg-text">pressUp() / pressDown()</text>

  <!-- Step 2: Floor triggers ExternalButtons -->
  <circle cx="350" cy="220" r="10" class="num-badge"/>
  <text x="350" y="224" class="num-text">2</text>
  <line x1="350" y1="220" x2="595" y2="220" class="msg-line" marker-end="url(#arrow-blue)"/>
  <text x="370" y="213" class="msg-text">pressUP(floor) / pressDown(floor)</text>

  <!-- Step 3: Dispatcher selects controller -->
  <circle cx="600" cy="260" r="10" class="num-badge"/>
  <text x="600" y="264" class="num-text">3</text>
  <line x1="600" y1="260" x2="845" y2="260" class="msg-line" marker-end="url(#arrow-blue)"/>
  <text x="620" y="253" class="msg-text">assignRequestToElevator(floor, direction)</text>

  <!-- alt Box: Controller decision -->
  <rect x="730" y="295" width="410" height="230" class="alt-box"/>
  <text x="745" y="315" class="alt-label">[ acceptNewRequest Logic ]</text>

  <!-- Scenario A: IDLE -->
  <text x="745" y="340" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="bold">Case A: Elevator is IDLE</text>
  <line x1="850" y1="360" x2="1060" y2="360" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="860" y="353" class="msg-text">setDirection(UP / DOWN)</text>
  <rect x="850" y="375" width="220" height="24" class="note-box"/>
  <text x="860" y="391" class="note-text">Enqueue to upQueue or downQueue</text>

  <!-- Scenario B: Moving Same Direction -->
  <line x1="730" y1="415" x2="1140" y2="415" stroke="#475569" stroke-dasharray="2,2"/>
  <text x="745" y="435" fill="#34d399" font-size="11" font-family="sans-serif" font-weight="bold">Case B: Same Direction &amp; Ahead of Car</text>
  <rect x="850" y="445" width="230" height="24" class="note-box"/>
  <text x="860" y="461" class="note-text">Directly offer to upQueue / downQueue</text>

  <!-- Scenario C: Opposite or Behind -->
  <line x1="730" y1="480" x2="1140" y2="480" stroke="#475569" stroke-dasharray="2,2"/>
  <text x="745" y="500" fill="#f59e0b" font-size="11" font-family="sans-serif" font-weight="bold">Case C: Opposite Direction or Behind Floor</text>
  <rect x="850" y="510" width="250" height="24" class="note-box"/>
  <text x="860" y="526" class="note-text">Buffer into pendingQueueUP / Down</text>

  <!-- Step 4: Passenger inside lift presses button -->
  <g transform="translate(80, 580)">
    <rect width="1050" height="70" fill="#1e293b" rx="6" stroke="#334155"/>
    <circle cx="30" cy="35" r="12" fill="#ec4899"/>
    <text x="30" y="39" class="num-text">IN</text>
    <text x="55" y="27" fill="#f8fafc" font-weight="bold" font-size="12" font-family="sans-serif">Internal In-Cabin Request Flow:</text>
    <text x="55" y="48" fill="#94a3b8" font-size="11" font-family="monospace">InternalButtons.pressButton(targetFloor) → InternalButtonDispatcher.submitRequest() → Controller.processInternalRequest()</text>
  </g>

</svg>